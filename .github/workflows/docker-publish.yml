name: Test, Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 环境变量：统一小写 + 提取SHA前7位
env:
  # 镜像名强制小写（解决GHCR大小写问题）
  IMAGE_NAME: "hirenexy/ci-cd-practice"
  IMAGE_TAG_SHORT: ${{ slice(github.sha, 0, 7) }}
  # 完整SHA（可选，如需更唯一可保留）
  IMAGE_TAG_FULL: ${{ github.sha }}

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  build-and-push-job:
    needs: test-job
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 同时打3个标签（按需选择，推荐短SHA+latest）
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_SHORT }}  # 短SHA（核心：唯一标识）
            ghcr.io/${{ env.IMAGE_NAME }}:latest                       # latest（最新版本）
            # ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_FULL }}  # 完整SHA（可选，注释掉则不打）
          cache-from: type=gha
          cache-to: type=gha,mode=max
