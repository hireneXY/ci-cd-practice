# 工作流名称
name: Test, Build and Push Docker Image

# 触发条件：推送到main/master分支、手动触发
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 环境变量（全局复用，可根据实际情况修改）
env:
  # GHCR 镜像名称格式：ghcr.io/用户名/仓库名:标签
  IMAGE_NAME: ${{ github.repository }}
  # 镜像标签（这里用提交哈希值，也可改为 latest）
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # 第一个Job：运行测试
  test-job:
    runs-on: ubuntu-latest
    steps:
      # 步骤1：检出仓库代码（必须，否则无法访问项目文件）
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：设置Node.js环境（适配npm test，版本可根据项目修改）
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # 项目实际使用的Node版本

      # 步骤3：安装项目依赖
      - name: Install dependencies
        run: npm install

      # 步骤4：运行测试命令
      - name: Run tests
        run: npm test

  # 第二个Job：构建并推送Docker镜像（依赖test-job成功）
  build-and-push-job:
    needs: test-job  # 仅test-job成功后才执行
    runs-on: ubuntu-latest
    # 授予作业访问GHCR的权限
    permissions:
      packages: write  # 允许推送镜像到GHCR
      contents: read   # 允许检出代码

    steps:
      # 步骤1：检出仓库代码（需要Dockerfile等文件）
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：设置Docker Buildx（增强版构建工具，支持多平台）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步骤3：登录GitHub Container Registry（GHCR）
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # 自动使用GitHub内置令牌，无需手动创建
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 步骤4：构建并推送Docker镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .  # 构建上下文（Dockerfile所在目录，当前根目录）
          push: true  # 启用推送
          # 镜像标签（可同时设置多个，比如ghcr.io/xxx/xxx:latest）
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          # 缓存构建层，加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
