name: Test, Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 仅定义基础环境变量（避免表达式函数）
env:
  IMAGE_NAME: "hirenexy/ci-cd-practice"
  FULL_SHA: ${{ github.sha }}

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  build-and-push-job:
    needs: test-job
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 新增步骤：用Shell命令提取SHA前7位（100%兼容）
      - name: Get short SHA
        id: get-sha
        run: echo "SHORT_SHA=${{ env.FULL_SHA }}:::0:7" | sed 's/:::/\\:/g' | xargs -I {} echo "{}" | cut -c1-7 | xargs echo "SHORT_SHA={}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 用Shell提取的短SHA + latest标签
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
