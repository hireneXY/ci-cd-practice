
name: Test, Build and Push Docker Image

# 触发条件
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # 第一步：运行测试
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  # 第二步：构建并推送镜像（依赖测试通过）
  build-and-push-job:
    needs: test-job
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 关键步骤1：手动定义全小写镜像名（彻底避开toLower函数）
      - name: Define image name (lowercase)
        id: set-image-name
        run: echo "IMAGE_NAME=hirenexy/ci-cd-practice" >> $GITHUB_ENV 

      # 关键步骤2：用Shell提取SHA（完整/短哈希，无需任何Actions表达式）
      - name: Get Git commit SHA
        id: set-sha
        run: |
          echo "FULL_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV  # 完整SHA
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV  # 短SHA（前7位）

      # 配置Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建并推送（用Shell定义的环境变量，无任何表达式函数）
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
